events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    resolver 127.0.0.11 ipv6=off valid=30s;
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 22m;
        location / { try_files $uri $uri/ /index.html; }
        location ^~ /api/ {
            set $backend_upstream http://mamarezepte-backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
        location /health {
            set $backend_health http://mamarezepte-backend:8000/health;
            proxy_pass $backend_health;
            access_log off;
        }
        # Historic recipe data is now served by the API only.
        location /data/ { return 404; }
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript application/json;
    }
}
