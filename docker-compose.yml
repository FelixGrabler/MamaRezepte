services:
  recipes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recipes
      POSTGRES_DB: recipes
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - recipes-db-data:/var/lib/postgresql/data
    networks:
      - recipes-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PYTHONUNBUFFERED: "1"
      AUTH_SERVICE_URL: http://shared-auth:8000
      SITE_ORIGIN: ${SITE_ORIGIN:-https://rezepte.grabler.me}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    secrets:
      - postgres_password
    volumes:
      - ./backend/data/recipes.db:/app/data/recipes.db:ro
      - ./frontend/public/data/images:/app/legacy-images:ro
      - recipe-uploads:/app/uploads
    depends_on:
      recipes-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      recipes-internal:
      grabler-network:
        aliases:
          - mamarezepte-backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8050:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      grabler-network:
        aliases:
          - mamarezepte-frontend

  backup:
    build: ./ops
    entrypoint: ["/bin/sh", "/ops/schedule.sh"]
    environment:
      PGHOST: recipes-db
      PGUSER: recipes
      PGDATABASE: recipes
      BACKUP_KEEP: "8"
    secrets:
      - postgres_password
    volumes:
      - ./ops:/ops:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - recipe-uploads:/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && test $$(( $$(date +%s) - $$(cat /backups/last-success) )) -lt 691200"]
      interval: 1h
      timeout: 5s
      retries: 1
      start_period: 5m
    restart: unless-stopped
    networks:
      - recipes-internal

networks:
  grabler-network:
    external: true
  recipes-internal:
    internal: true

volumes:
  recipes-db-data:
  recipe-uploads:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
